<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · KKJ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#0E1116; --text:#E6EAF0; --muted:#8B95A3; --accent:#4FD1C5; }
    @media (prefers-color-scheme: light) { :root { --bg:#F6F7F9; --text:#12161C; --muted:#5B6472; --accent:#0F8A80; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font:16px/1.6 ui-monospace, Consolas, monospace; padding:16px; text-align:center; }
    .p { color:var(--accent); } a { color:var(--accent); } p { color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div><span class="p">$</span> cd this-page</div>
    <p>bash: cd: this-page: No such file or directory (404)</p>
    <a href="/">← back to the portfolio</a>
  </main>
</body>
</html>
